# ============================================================
# CONTOH KONFIGURASI CLOUDFLARE TUNNEL
# ------------------------------------------------------------
# Salin file ini ke:
#   C:\Users\<NAMA-ANDA>\.cloudflared\config.yml
#
# Lalu ganti:
#   - <UUID-TUNNEL>  -> id dari `cloudflared tunnel create foto-woeng`
#   - <NAMA-ANDA>    -> nama user Windows Anda
#   - monitoring.woeng.my.id -> subdomain yang Anda pakai
#
# Cara membuat tunnel (sekali saja):
#   cloudflared tunnel login
#   cloudflared tunnel create foto-woeng
#   cloudflared tunnel route dns foto-woeng monitoring.woeng.my.id
#
# Cara menjalankan:
#   cloudflared tunnel run foto-woeng
# ============================================================

tunnel: <UUID-TUNNEL>
credentials-file: C:\Users\<NAMA-ANDA>\.cloudflared\<UUID-TUNNEL>.json

# Kualitas koneksi (opsional, aman untuk default)
# loglevel: info
# protocol: quic

ingress:
  # Semua request ke subdomain diteruskan ke proxy APLIKASI+FOTO lokal
  # (port 8000). Proxy yang sama melayani aplikasi (bridge ke Cloudflare
  # Pages), /photos/* (foto dari disk lokal), dan /storage-api/*.
  - hostname: monitoring.woeng.my.id
    service: http://localhost:8000

  # Wajib ada sebagai aturan terakhir: tolak hostname lain.
  - service: http_status:404
